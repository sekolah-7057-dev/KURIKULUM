ment.getElementById('modalEmail').innerText = email;\n    officerModal.classList.remove('hidden');\n  }\n\n  function closeOfficerModal() {\n    officerModal.classList.add('hidden');\n  }\n\n  function copyOfficerEmail() {\n    const email = document.getElementById('modalEmail').innerText;\n    navigator.clipboard.writeText(email).then(() => {\n      showToast('Emel pegawai disalin: ' + email);\n      closeOfficerModal();\n    }).catch(() => {\n      showToast('Maklumat telah disalin ke papan keratan');\n      closeOfficerModal();\n    });\n  }\n\n  function showToast(msg) {\n    const toast = document.getElementById('toastNotification');\n    document.getElementById('toastText').innerText = msg;\n    toast.classList.remove('hidden');\n    setTimeout(() => {\n      toast.classList.add('hidden');\n    }, 2800);\n  }\n\n  function triggerDownloadAlert() {\n    showToast('Memuat turun Buku Pengurusan Kurikulum 2026 (PDF)...');\n  }\n\n  // Live filter and search combined engine\n  function applyFilterAndSearch() {\n    const query = searchInput.value.trim().toLowerCase();\n    clearSearchBtn.classList.toggle('hidden', query.length === 0);\n\n    let totalVisible = 0;\n\n    sections.forEach(section => {\n      const category = section.getAttribute('data-category');\n      const isCategoryMatch = (activeFilter === 'all' || activeFilter === category);\n      \n      let sectionHasVisibleCards = false;\n\n      const cards = section.querySelectorAll('.staff-card');\n      cards.forEach(card => {\n        const name = (card.getAttribute('data-name') || '').toLowerCase();\n        const role = (card.getAttribute('data-role') || '').toLowerCase();\n        const matchesQuery = query === '' || name.includes(query) || role.includes(query);\n\n        if (isCategoryMatch && matchesQuery) {\n          card.classList.remove('hidden');\n          sectionHasVisibleCards = true;\n          totalVisible++;\n        } else {\n          card.classList.add('hidden');\n        }\n      });\n\n      // Show/hide entire category container based on match\n      if (isCategoryMatch && (sectionHasVisibleCards || query === '')) {\n        section.classList.remove('hidden');\n      } else {\n        section.classList.add('hidden');\n      }\n    });\n\n    noResultsState.classList.toggle('hidden', totalVisible > 0);\n  }\n\n  // Event Listeners for Filters\n  filterPills.forEach(pill => {\n    pill.addEventListener('click', () => {\n      filterPills.forEach(p => {\n        p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');\n        p.classList.add('bg-surface-container', 'text-on-surface-variant');\n      });\n      pill.classList.remove('bg-surface-container', 'text-on-surface-variant');\n      pill.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');\n\n      activeFilter = pill.getAttribute('data-filter');\n      applyFilterAndSearch();\n    });\n  });\n\n  searchInput.addEventListener('input', applyFilterAndSearch);\n\n  clearSearchBtn.addEventListener('click', () => {\n    searchInput.value = '';\n    applyFilterAndSearch();\n    searchInput.focus();\n  });\n\n  function resetFilters() {\n    searchInput.value = '';\n    activeFilter = 'all';\n    filterPills.forEach(p => {\n      if (p.getAttribute('data-filter') === 'all') {\n        p.classList.add('bg-primary', 'text-on-primary', 'shadow-sm');\n        p.classList.remove('bg-surface-container', 'text-on-surface-variant');\n      } else {\n        p.classList.remove('bg-primary', 'text-on-primary', 'shadow-sm');\n        p.classList.add('bg-surface-container', 'text-on-surface-variant');\n      }\n    });\n    applyFilterAndSearch();\n  }\n\n  // Close modal when tapping outside content\n  officerModal.addEventListener('click', (e) => {\n    if (e.target === officerModal) {\n      closeOfficerModal();\n    }\n  });\n<\/script></main><nav class=\"fixed bottom-0 w-full z-50 pb-safe bg-surface/85 backdrop-blur-xl shadow-[0_-2px_12px_rgba(13,89,161,0.06)]\" data-active-classes=
